name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            arch: arm64
            gate: mac
          - name: Linux x86-64
            runner: ubuntu-24.04
            arch: x64
            gate: linux
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            gate: linux

    env:
      TEST262_SHA: 91c70759363c46557b694792bf34a2551a7af5ba
      TINT_GATE_STAGE_TIMEOUT: 2700

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install workspace dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          pnpm install --frozen-lockfile

      - name: Install Linux debugger
        if: matrix.gate == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb
          lldb --version

      - name: Ensure macOS OpenSSL 3 is installed
        if: matrix.gate == 'mac'
        run: |
          if ! brew list --versions openssl@3; then
            brew install openssl@3
          fi
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib"

      - name: Prepare macOS SDK and debugger
        if: matrix.gate == 'mac'
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-version
          lldb --version

      # Only the macOS gate consumes the Test262 checkout.
      - name: Restore Test262 checkout
        if: matrix.gate == 'mac'
        id: test262-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/test262
          key: test262-${{ runner.os }}-${{ env.TEST262_SHA }}

      - name: Prepare pinned Test262 checkout
        if: matrix.gate == 'mac'
        run: |
          checkout="$RUNNER_TEMP/test262"
          if [ ! -d "$checkout/.git" ]; then
            git init "$checkout"
            git -C "$checkout" fetch --depth=1 https://github.com/tc39/test262.git "$TEST262_SHA"
            git -C "$checkout" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$checkout" rev-parse HEAD)" = "$TEST262_SHA"
          echo "TINT_GATE_TEST262=$checkout" >> "$GITHUB_ENV"

      - name: Save Test262 checkout
        if: matrix.gate == 'mac' && steps.test262-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/test262
          key: ${{ steps.test262-cache.outputs.cache-primary-key }}

      - name: Run pinned Node crypto cases
        env:
          TINT_GATE_EXCLUSIVE_LOCK: ${{ runner.temp }}/tint-gate/exclusive.lock
          TZ: UTC
        run: |
          set -eu
          archive="$RUNNER_TEMP/node-v26.13.1.tar.gz"
          curl -fsSL --retry 4 https://nodejs.org/dist/v26.13.1/node-v26.13.1.tar.gz -o "$archive"
          printf '%s  %s\n' 60c6cdf11c3e9d5932fccd0eafae77f1152661584e129047684cb8646f228d3e "$archive" | shasum -a 256 -c
          for suite in hash hmac pbkdf2 random; do
            tar -xzf "$archive" -C "$RUNNER_TEMP" "node-v26.13.1/test/parallel/test-crypto-$suite.js"
          done
          mkdir -p "$RUNNER_TEMP/tint-gate"
          pnpm build
          node tools/node-crypto-native-conformance.ts "$RUNNER_TEMP/node-v26.13.1" "$RUNNER_TEMP/crypto-conformance.json"

      - name: Upload pinned Node crypto case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crypto-conformance-${{ matrix.runner }}
          path: ${{ runner.temp }}/crypto-conformance.json

      - name: Run macOS gate
        if: matrix.gate == 'mac'
        env:
          TINT_GATE_ADMISSION_DIRECTORY: ${{ runner.temp }}/tint-gate/admission
          TINT_GATE_EXCLUSIVE_LOCK: ${{ runner.temp }}/tint-gate/exclusive.lock
          TINT_GATE_MEMORY_DIRECTORY: ${{ runner.temp }}/tint-gate/memory
          TINT_GATE_MEMORY_SLOTS: 1
          TINT_GATE_BUDGET: 7500
          TINT_GATE_NATIVE_CONCURRENCY: 2
          TINT_GATE_NATIVE_TIMEOUT: 3600
          NODE_OPTIONS: --max-old-space-size=5120
        run: tools/gate/mac-gate.sh

      - name: Run Linux gate
        if: matrix.gate == 'linux'
        env:
          # Node defaults to roughly 2 GiB on an 8 GiB runner.
          NODE_OPTIONS: --max-old-space-size=5120
        run: tools/gate/linux-gate.sh

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-${{ matrix.runner }}
          path: .tint-bootstrap/gate.*/
          include-hidden-files: true

      - name: Upload macOS native test results
        if: success() && matrix.gate == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-tests-${{ matrix.runner }}
          path: .tint-bootstrap/gate.*/check-native.log
          include-hidden-files: true
