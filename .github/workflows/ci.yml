name: CI

# Gate each commit once: pushes to main, plus every pull request (its head
# commit is gated by the pull_request event, not a duplicate push run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, boundaries, formatting and the compiler catalog do not depend
  # on the host, so they run once.
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-setup
        with:
          arch: x64
      - run: tools/gate/ci.sh static
      - if: always()
        uses: ./.github/actions/gate-evidence
        with:
          name: static

  # macOS runners are scarce (five per organization) and run Node 2–2.5×
  # slower, so a Linux runner builds the Darwin stage 1; it is byte-identical
  # to a macOS build (docs/results/ci-fast-gate-v1.md).
  macos-arm64:
    name: macOS arm64
    uses: ./.github/workflows/gate.yml
    with:
      id: macos-arm64
      runner: macos-26
      arch: arm64
      bootstrap-runner: ubuntu-24.04
      bootstrap-arch: x64
      bootstrap-target: darwin-aarch64
      macos: true

  linux-x86-64:
    name: Linux x86-64
    uses: ./.github/workflows/gate.yml
    with:
      id: linux-x86-64
      runner: ubuntu-24.04
      arch: x64
      bootstrap-runner: ubuntu-24.04
      bootstrap-arch: x64
      macos: false

  linux-arm64:
    name: Linux arm64
    uses: ./.github/workflows/gate.yml
    with:
      id: linux-arm64
      runner: ubuntu-24.04-arm
      arch: arm64
      bootstrap-runner: ubuntu-24.04-arm
      bootstrap-arch: arm64
      macos: false
